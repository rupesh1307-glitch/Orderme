<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrderMe - Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="toast.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-title">
                <a href="index.html" style="text-decoration:none;display:inline-flex;align-items:center;gap:8px;">
                    <img src="https://raw.githubusercontent.com/rupesh1307-glitch/Orderme/46639de8dd386020db4cd4f755de0828b26e6c16/Gemini_Generated_Image_959jgv959jgv959j.png" alt="OrderMe Logo">
                </a>
            </div>

            <h2 class="auth-subtitle">Create Account</h2>
            <p class="auth-desc">Join OrderMe for instant delivery and exclusive deals</p>

            <form class="auth-form" id="signupForm">
                <div class="form-group">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" placeholder="John Doe" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" placeholder="john@example.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="signup-phone">Phone Number</label>
                    <input type="tel" id="signup-phone" placeholder="9876543210" autocomplete="tel">
                </div>

                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="At least 6 characters" required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="signup-confirm">Confirm Password</label>
                    <input type="password" id="signup-confirm" placeholder="Repeat your password" required autocomplete="new-password">
                </div>

                <button type="submit" class="auth-btn" id="submitBtn">Create My Account &rarr;</button>
            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Sign In</a>
            </p>
            <p class="auth-back">
                <a href="index.html">&larr; Back to Home</a>
            </p>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="js/toast.js"></script>
    <script src="js/api.js"></script>
    <script>
        const form = document.getElementById('signupForm');
        const nameInput = document.getElementById('signup-name');
        const emailInput = document.getElementById('signup-email');
        const phoneInput = document.getElementById('signup-phone');
        const passwordInput = document.getElementById('signup-password');
        const confirmInput = document.getElementById('signup-confirm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const phone = phoneInput.value.trim();
            const password = passwordInput.value.trim();
            const confirm = confirmInput.value.trim();

            if (!name || !email || !password) {
                Toast.error('Please fill in all required fields.');
                return;
            }

            if (password.length < 6) {
                Toast.error('Password must be at least 6 characters.');
                return;
            }

            if (password !== confirm) {
                Toast.error('Passwords do not match.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';

            try {
                const res = await API.register({ name, email, phone, password });
                Toast.success('Account created successfully! Welcome to OrderMe.');
                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 900);
            } catch (err) {
                console.error(err);
                Toast.error(err.message || 'Registration failed. Please try again.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create My Account →';
            }
        });
    </script>
</body>
</html>
